name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 后端测试要本机 PostgreSQL 16：ubuntu-latest（24.04）自带，装在 /usr/lib/postgresql/16/bin；scripts/db.mjs 默认找的是 Homebrew 路径
      - run: npm test
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
