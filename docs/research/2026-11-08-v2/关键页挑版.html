      <div class="c dark" style="gap:14px"><div class="ch"><h3>最重要的下一步</h3><span class="sp"></span><span class="faint">${d.actions.length} 条未完成</span></div>
        ${d.actions.length ? d.actions.map(a => `<div style="display:grid;gap:8px"><div class="ch"><span class="tag">${a.kind}</span><span class="faint">${a.due}</span></div><b style="font-size:22px;font-weight:600;line-height:1.35">${a.text}</b><span class="mute">来自 ${a.from}</span><div><span class="btn light">${a.kind === '修改再交' ? '修改再交' : '去节点里处理'}</span></div></div>`).join('')
        : `<div style="display:grid;gap:6px;padding:8px 0"><b style="font-size:19px;font-weight:600">${d.coord.length ? '成果在等带教评审' : '现在没有要你做的下一步'}</b><span class="mute">${d.coord.length ? '评审结果出来后，带教给你的行动会出现在这里。' : d.e ? '先和带教商量项目题目，在「项目」里新建。' : '有新的评审后，这里会提醒你。'}</span></div>`}</div>
      <div class="c"><div class="ch"><h3>需要协调的事</h3></div>${coordList(d)}</div></div>
      <div class="grid" style="grid-template-columns:1fr 1fr 1fr"><div class="c"><div class="ch"><h3>在推进</h3></div>${f ? `<div class="rows"><div class="row"><div class="grow"><b>${f.p.name}</b><br><span class="mute">主责 · 项目带教 ${f.p.mentor}</span></div></div>${f.p.milestones.map(nodeLine).join('')}</div>` : empty(d.e ? '还没有项目' : '没有推进中的项目', d.e ? '在「项目」里新建' : '来电归因优化已于 12.08 结项')}</div>
      <div class="c"><div class="ch"><h3>最新带教反馈</h3></div>${feedbackList(d, 1)}</div>${coverageCard(d)}</div>`; },
  3: d => { const f = focusOf(d); const p = d.project;
    const loop = ['提交', '评审', '行动', '再交'];
    const at = { revise: 2, pending: 1, blocked: 2, empty: -1, ended: -1 }[d.st];
    // 每一步：[标签, 标题, 谁, 时间, 说明, 圆点样式]
    const steps = d.e ? [] : p.milestones.flatMap(m => m.versions.flatMap(v => [['提交', `${m.name} V${v.v}`, v.by, v.at, v.change || v.text, 'w'], ...(v.review ? [[`评审 · ${v.review.grade}`, `${m.name} V${v.v}`, v.review.by, v.review.at, v.review.key, v.review.grade === '需改进' ? 'r' : 'g'], ...v.review.actions.filter(a => a.kind !== '建议').map(a => [`行动 · ${a.kind}`, a.text, `负责人 ${a.owner}`, v.review.at, a.status === '未完成' ? '还没完成' : `已完成 · ${a.done}`, a.status === '未完成' ? 'a' : 'g'])] : [])])).reverse();
    return hello(d) + `<div class="grid" style="grid-template-columns:300px 1fr">
      <div class="grid"><div class="c dark"><div class="ch"><h3>和带教的来回</h3></div>${f ? `<b style="font-size:17px">${f.p.name} · ${f.m.name}</b><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">${loop.map((s, i) => `<div style="text-align:center;padding:8px 0;border-radius:10px;${i === at ? 'background:#4A4ED8;color:#fff;font-weight:600' : 'background:rgba(255,255,255,.07);color:rgba(255,255,255,.6)'}">${s}</div>`).join('')}</div><span class="mute">${{ revise: '轮到你：按评审的行动修改再交', pending: '轮到带教：V2 在等周颖评审', blocked: '轮到你：问题定义已通过，推进分流方案验证；节点受阻，等主管批排班' }[d.st]}</span>` : `<span class="mute">${d.e ? '还没有项目，来回从第一次提交开始。' : '项目已结项，没有进行中的来回。'}</span>`}</div>
        <div class="c"><div class="ch"><h3>需要协调的事</h3></div>${coordList(d)}</div>${coverageCard(d)}</div>
      <div class="c"><div class="ch"><h3>回路时间线</h3><span class="sp"></span><small>最新在上</small></div>${steps.length ? `<div class="tl">${steps.slice(0, 7).map(s => `<div class="ev"><span class="t">${s[3]}</span><span class="rail"><i class="${s[5]}"></i></span><div class="body"><div class="ch"><span class="tag">${s[0]}</span><b>${s[1]}</b></div><span class="mute">${s[4]}</span><span class="faint">${s[2]}</span></div></div>`).join('')}</div>` : empty('还没有来回', '提交第一版成果后，评审、行动、再交会按顺序排在这里')}</div></div>`; },
};

// ---------- 工作台首页 · 带教 ----------
function helloM(d) { const n = d.toReview.length + d.toConfirm.length + d.blockers.length; return `<div class="title"><div><small>${d.today}</small><h1>周颖，${n ? `有 <em>${n} 件事</em>等你判断` : '没有等你判断的事'}</h1></div></div>`; }
const reviewRow = r => `<div class="row"><div class="av ${r[0] === '林夏' ? 'g' : ''}">${r[0][0]}</div><div class="grow"><b>${r[1]}</b><br><span class="mute">${r[0]} · ${r[2]}</span></div><span class="faint">${r[3]}</span><span class="btn pri">评审</span></div>`;
const confirmRow = r => `<div class="row"><div class="grow"><b>${r[0]}</b><br><span class="mute">主责 ${r[1]} · ${r[2]}</span></div><span class="btn">确认立项</span></div>`;
const blockerRow = r => `<div class="row">${blockPill}<div class="grow"><b>${r[1]}</b><br><span class="mute">${r[0]} · ${r[2]}</span></div><span class="faint">${r[3]}</span><span class="btn">响应</span></div>`;
function dashboard(d) { return `<div class="c"><div class="ch"><h3>决策看板</h3><span class="tag">管理</span><span class="sp"></span><small>基础计数，口径见规则池 R7</small></div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="well kpi"><small>同一节点连续两次需改进</small><b class="big">0</b><small>没有项目卡在同一节点</small></div><div class="well kpi"><small>每位带教当前待评审</small><div style="display:flex;gap:16px">${d.pendingBy.map(p => `<span><b class="big">${p[1]}</b> <span class="mute">${p[0]}</span></span>`).join('')}</div></div></div></div>`; }
function menteeRow(m) { return `<div class="row"><div class="av ${m[0] === '林夏' ? 'g' : ''}">${m[0][0]}</div><div style="width:120px"><b>${m[0]}</b><br><span class="mute">${m[1]}</span></div><div class="grow"><b>${m[2]}</b><br><span class="mute">${m[3] || '—'}</span></div><div style="width:100px"><span class="faint">最近反馈</span><br>${m[4]}</div><div style="width:60px">${m[5].map(() => blockPill).join('') || '<span class="faint">无风险</span>'}</div></div>`; }
const homeM = {
  1: d => { const lanes = [['草拟 · 待确认立项', d.toConfirm.map(r => [r[0], `主责 ${r[1]}`, '确认立项'])], ['推进中', d.e ? [] : [['来电归因优化', '林夏主责 · 许诺参与', { revise: '问题定义 需修改', pending: '问题定义 待评审', blocked: '分流方案验证 进行中', ended: '' }[d.st]]].filter(x => d.st !== 'ended').concat(d.st === 'blocked' || d.st === 'ended' ? [['渠道转化复盘', '许诺主责', '现状梳理 进行中']] : [])],
      ['等我评审', d.toReview.map(r => [r[1], `${r[0]} · ${r[2]}`, '评审'])], ['受阻', d.blockers.map(r => [r[1], `${r[0]} · ${r[2]}`, '响应']).concat(d.st === 'blocked' ? [['来电归因优化 · 分流方案验证', '林夏 · 已响应，仍受阻', '']] : [])]];
    return helloM(d) + `<div class="c"><div class="ch"><h3>我带的人的项目</h3><span class="sp"></span><small>按项目状态分列</small></div><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px">${lanes.map(([t, cards]) => `<div class="lane"><h4>${t}<span class="faint">${cards.length}</span></h4>${cards.length ? cards.map(c => `<div class="card"><b>${c[0]}</b><span class="mute">${c[1]}</span>${c[2] ? `<span>${['确认立项', '评审', '响应'].includes(c[2]) ? `<span class="btn ${c[2] === '评审' ? 'pri' : ''}">${c[2]}</span>` : pill(c[2].split(' ').pop()) + ' <span class="faint">' + c[2].split(' ')[0] + '</span>'}</span>` : ''}</div>`).join('') : '<span class="faint" style="padding:6px 2px">无</span>'}</div>`).join('')}</div></div>
      <div class="grid" style="grid-template-columns:1.3fr 1fr"><div class="c"><div class="ch"><h3>我带的人</h3></div><div class="rows">${d.mentees.map(menteeRow).join('')}</div></div>${dashboard(d)}</div>`; },
  2: d => helloM(d) + `<div class="c dark"><div class="ch"><h3>待我判断</h3><span class="sp"></span><span class="faint">与待办一致</span></div><div class="cols3">
      ${[['待我评审', d.toReview, reviewRow, '没有等你评审的成果'], ['待确认立项', d.toConfirm, confirmRow, '没有草拟的项目'], ['受阻待响应', d.blockers, blockerRow, '没有未响应的受阻']].map(([t, list, fn, none]) => `<div class="well on-light" style="display:grid;gap:4px;align-content:start"><div class="ch"><b>${t}</b><span class="sp"></span><span class="num" style="font-weight:700;font-size:19px">${list.length}</span></div>${list.length ? `<div class="rows">${list.map(fn).join('')}</div>` : `<span class="mute" style="padding:8px 0">${none}</span>`}</div>`).join('')}</div></div>
      <div class="grid" style="grid-template-columns:1.3fr 1fr"><div class="c"><div class="ch"><h3>我带的人</h3><span class="sp"></span><small>每人一行</small></div><div class="rows">${d.mentees.map(menteeRow).join('')}</div></div>${dashboard(d)}</div>`,
  3: d => helloM(d) + `<div class="grid" style="grid-template-columns:1fr 1fr">${d.mentees.map((m, i) => { const mine = [...d.toReview.filter(r => r[0] === m[0]).map(reviewRow), ...d.toConfirm.filter(r => r[1] === m[0]).map(confirmRow), ...d.blockers.filter(r => r[0] === m[0]).map(blockerRow)];
      return `<div class="c ${i === 0 && mine.length ? 'dark' : ''}"><div class="ch"><div class="av ${m[0] === '林夏' ? 'g' : ''}">${m[0][0]}</div><div><h3>${m[0]}</h3><small class="${i === 0 && mine.length ? 'faint' : ''}">${m[1]}</small></div><span class="sp"></span>${m[5].map(() => blockPill).join('')}</div>
        <div class="well"><span class="faint">当前项目</span><br><b>${m[2]}</b> <span class="mute">${m[3] || ''}</span><br><span class="faint">最近反馈 ${m[4]}</span></div>
        <div><b style="font-size:12.5px">等你处理（${mine.length}）</b>${mine.length ? `<div class="rows ${i === 0 ? 'on-light' : ''}" style="${i === 0 ? 'border-radius:12px;padding:2px 10px;margin-top:6px' : ''}">${mine.join('')}</div>` : `<p class="mute" style="margin-top:4px">没有等你处理的事</p>`}</div></div>`; }).join('')}</div>${dashboard(d)}`,
};

// ---------- 项目详情 ----------
function projHead(d) { const p = d.project; return `<div class="title"><div><small>项目实践 · ${p.status === '草拟' ? '草拟中，等带教确认立项' : p.confirmed ? '立项确认 ' + p.confirmed : ''}</small><h1>${p.name}</h1></div>${pill(p.status)}<span class="sp"></span>${p.status === '草拟' ? '<span class="btn pri">确认立项</span>' : p.status === '推进中' ? '<span class="btn">新建节点</span><span class="btn">填写结论</span>' : '<span class="btn">补记业务验证</span>'}</div>`; }
function infoCard(p) { return `<div class="c"><div class="ch"><h3>项目</h3></div><p>${p.goal}</p><dl class="kv"><dt>验收条件</dt><dd>${p.accept}</dd><dt>业务验收</dt><dd>${p.acceptor}</dd><dt>成员</dt><dd>${p.members.map(m => `${m[0]}（${m[1]}）`).join('、')}</dd><dt>项目带教</dt><dd>${p.mentor} <span class="faint">${p.mentorWhy}</span></dd><dt>关联站</dt><dd>${p.stations}</dd></dl></div>`; }
function conclCard(p) { const c = p.conclusion; return `<div class="c"><div class="ch"><h3>项目结论</h3><span class="sp"></span>${c ? pill('已结束') : ''}</div>${c ? `<div class="grid" style="grid-template-columns:1fr 1fr"><div class="well kpi"><small>交付结论</small>${pill(c.delivery)}<small>${c.evidence}</small></div><div class="well kpi"><small>业务验证</small>${pill(c.verify)}<small>结项后可补记</small></div></div><dl class="kv"><dt>经验</dt><dd>${c.lessons}</dd><dt>后续建议</dt><dd>${c.next}</dd><dt>结项</dt><dd>${c.closed}</dd></dl>` : empty('还没有结论', p.status === '推进中' ? '节点都通过后，由主责填写交付结论和业务验证' : '确认立项、推进节点后再填')}</div>`; }
function versionBlock(v, m) {
  const r = v.review;
  return `<div class="well" style="display:grid;gap:8px"><div class="ch"><b>V${v.v}</b><span class="mute">${v.by} · ${v.at}</span><span class="sp"></span>${r ? pill(r.grade) : pill('待评审')}</div><span>${v.change ? '修改说明：' + v.change : v.text}</span>
    ${r ? `<div class="q"><b>关键问题</b>　${r.key}<br><b>带教判断</b>　${r.judge}</div>${r.actions.length ? r.actions.map(a => `<div class="ch"><span class="tag">${a.kind}</span><span style="flex:1">${a.text}</span>${a.status ? pill(a.status) : ''}<span class="faint">${a.owner ? '负责人 ' + a.owner : ''} ${a.done || ''}</span></div>`).join('') : ''}${r.credits.length ? `<div class="ch"><span class="tag">认定</span><span>${r.credits.join('；')}</span></div>` : ''}<span class="faint">评审 ${r.by} · ${r.at}</span>` : `<span class="faint">评审负责人 周颖（提交时按带教关系推出）</span>`}</div>`;
}
function blockerBlock(b) { return `<div class="well" style="display:grid;gap:6px;box-shadow:inset 0 0 0 1.5px #E5484D">${'<div class="ch">' + blockPill + pill(b.status) + `<b>${b.reason}</b></div>`}<span class="mute">需要 ${b.decider} 决定 · 处理人 ${b.handler} · ${b.by} ${b.at} 标记</span>${b.responses.map(r => `<div class="q">${r.by} ${r.at}：${r.text}</div>`).join('')}<div><span class="btn">解除受阻</span></div></div>`; }
function nodeDetail(m) { return `<div class="grid"><div class="ch"><h3 style="font-size:19px">${m.name}</h3>${pill(m.status)}${m.blocker ? blockPill : ''}<span class="sp"></span><span class="faint">截止 ${m.due}</span></div><dl class="kv"><dt>节点目标</dt><dd>${m.goal}</dd><dt>验收标准</dt><dd>${m.accept}</dd><dt>关联任务</dt><dd>${m.tasks.length ? m.tasks.map(t => `${t.owner} · ${t.name} ${t.credited ? pill('已认定') : ''}`).join('<br>') : '无'}</dd></dl>${m.blocker ? blockerBlock(m.blocker) : ''}${m.versions.length ? m.versions.slice().reverse().map(v => versionBlock(v, m)).join('') : empty('还没有成果版本', m.status === '未开始' ? '开始节点后，主责在这里提交飞书文档链接' : '做完后，主责在这里提交飞书文档链接')}</div>`; }
const proj = {
  1: d => { const p = d.project; const sel = p.milestones.find(m => !['已通过'].includes(m.status)) || p.milestones[p.milestones.length - 1];
    return projHead(d) + `<div class="c"><div class="ch"><h3>节点路线</h3><span class="sp"></span><small>点节点在下方展开</small></div>${nodeTrack(p)}</div>
      <div class="grid" style="grid-template-columns:1fr 320px"><div class="c">${nodeDetail(sel)}</div><div class="grid">${infoCard(p)}${conclCard(p)}</div></div>`; },
  2: d => { const p = d.project; const fb = d.e ? [] : p.milestones.flatMap(m => m.versions.filter(v => v.review).map(v => [m.name, v])).reverse();
    const open = d.e ? [] : p.milestones.flatMap(m => m.versions.flatMap(v => v.review ? v.review.actions.filter(a => a.status === '未完成').map(a => [m.name, a]) : []));
    return projHead(d) + `<div class="grid" style="grid-template-columns:280px 1fr 280px">${infoCard(p)}
      <div class="grid"><div class="c"><div class="ch"><h3>关键节点</h3><span class="sp"></span><small>${p.milestones.filter(m => m.status === '已通过').length} / ${p.milestones.length} 通过</small></div><table><thead><tr><th>节点</th><th>状态</th><th>截止</th><th>版本</th><th>任务</th></tr></thead><tbody>${p.milestones.map((m, i) => `<tr class="${i === 0 ? 'sel' : ''}"><td><b>${m.name}</b><br><span class="faint">${m.goal}</span></td><td style="white-space:nowrap">${pill(m.status)}${m.blocker ? ' ' + blockPill : ''}</td><td class="num" style="white-space:nowrap">${m.due}</td><td>${m.versions.length ? 'V' + m.versions[m.versions.length - 1].v : '—'}</td><td>${m.tasks.length}</td></tr>`).join('')}</tbody></table>
        <span class="faint">点一行，右侧抽屉打开节点详情：版本时间线、评审、受阻</span></div>${conclCard(p)}</div>
      <div class="grid"><div class="c"><div class="ch"><h3>未完成的下一步行动</h3></div>${open.length ? `<div class="rows">${open.map(([n, a]) => `<div class="row"><span class="tag">${a.kind}</span><div class="grow">${a.text}<br><span class="faint">${n} · ${a.owner}</span></div></div>`).join('')}</div>` : empty('没有未完成的行动', '')}</div>
        <div class="c"><div class="ch"><h3>最近反馈</h3></div>${fb.length ? `<div class="rows">${fb.slice(0, 3).map(([n, v]) => `<div class="row" style="align-items:flex-start"><div class="grow"><div class="ch"><b>${n} V${v.v}</b><span class="sp"></span>${pill(v.review.grade)}</div><span class="mute">${v.review.key}</span></div></div>`).join('')}</div>` : empty('还没有评审', '')}</div></div></div>`; },
  3: d => { const p = d.project; const log = [];
    if (!d.e) { log.push(['10.19', '创建项目', '林夏', '', ''], ['10.20', '确认立项', '周颖', '', 'g']);
      p.milestones.forEach(m => { log.push(['10.21', `新建节点 · ${m.name}`, '林夏', m.goal, '']); m.versions.forEach(v => { log.push([v.at.split(' ')[0], `提交 · ${m.name} V${v.v}`, v.by, v.change || v.text, 'w']); if (v.review) log.push([v.review.at.split(' ')[0], `评审 · ${m.name} V${v.v} · ${v.review.grade}`, v.review.by, v.review.key + (v.review.credits.length ? '；认定 ' + v.review.credits.join('、') : ''), v.review.grade === '需改进' ? 'r' : 'g']); });
        if (m.blocker) { log.push([m.blocker.at.split(' ')[0], `标记受阻 · ${m.name}`, m.blocker.by, m.blocker.reason, 'r']); m.blocker.responses.forEach(r => log.push([r.at.split(' ')[0], `响应受阻 · ${m.name}`, r.by, r.text + '（仍受阻）', ''])); } });
      if (p.conclusion) log.push(['12.07', '填写项目结论', '林夏', '交付达成、业务未验证', ''], ['12.08', '确认结项', '周颖', '完成', 'g']);
      log.sort((a, b) => a[0] < b[0] ? 1 : -1); }
    const cur = p.milestones.find(m => !['已通过'].includes(m.status));
    return projHead(d) + `<div class="c" style="grid-template-columns:repeat(5,minmax(0,1fr));display:grid"><div class="kpi"><small>节点</small><b class="big">${p.milestones.filter(m => m.status === '已通过').length}<span class="mute" style="font-size:15px"> / ${p.milestones.length} 通过</span></b></div><div class="kpi"><small>当前节点</small><b style="font-size:15px">${cur ? cur.name : '—'}</b>${cur ? '<span>' + pill(cur.status) + (cur.blocker ? ' ' + blockPill : '') + '</span>' : ''}</div><div class="kpi"><small>项目带教</small><b style="font-size:15px">${p.mentor}</b><small>${p.members.map(m => m[0]).join('、')}</small></div><div class="kpi"><small>交付 / 验证</small><b style="font-size:15px">${p.conclusion ? p.conclusion.delivery + ' / ' + p.conclusion.verify : '未结项'}</b></div><div class="kpi"><small>验收条件</small><span class="mute">${p.accept}</span></div></div>
      <div class="grid" style="grid-template-columns:1fr 320px"><div class="c"><div class="ch"><h3>项目日志</h3><span class="sp"></span><small>最新在上 · 每条都能点回节点或版本</small></div>${log.length ? `<div class="tl">${log.map(l => `<div class="ev"><span class="t">${l[0]}</span><span class="rail"><i class="${l[4]}"></i></span><div class="body"><div class="ch"><b>${l[1]}</b><span class="faint">${l[2]}</span></div>${l[3] ? `<span class="mute">${l[3]}</span>` : ''}</div></div>`).join('')}</div>` : empty('项目还在草拟', '许诺 11.06 创建，等带教确认立项后开始记录')}</div><div class="grid">${cur && cur.blocker ? `<div class="c">${blockerBlock(cur.blocker)}</div>` : ''}${infoCard(p)}${conclCard(p)}</div></div>`; },
};

// ---------- 成长档案 ----------
function profHead(d) { return `<div class="title"><div class="av g" style="width:52px;height:52px;font-size:20px">林</div><div><small>成长档案 · 2026 秋季班</small><h1>林夏</h1></div><span class="sp"></span><span class="chip">${d.station[0]} · ${d.station[2]}（第 ${d.station[1]} 站）</span><span class="chip">默认带教 周颖</span></div>`; }
function evItem(e, withItem) { const lv = `<div class="lv">${[1, 2, 3].map(i => `<span class="${i <= JUDGE[e.judge] ? 'on' : ''}"></span>`).join('')}</div><b style="font-size:12px;white-space:nowrap">${e.judge}</b>`;
  return `<div class="well" style="display:grid;gap:5px">${withItem ? `<div class="ch"><span class="tag">${['', '公司、行业与导师侧认知', '用户与服务链路认知', '实际项目推进与交付', '营销线', 'AI 使用与人机协同'][e.no]}</span><span class="sp"></span><span class="faint">${e.at}</span></div><div class="ch">${lv}</div>` : `<div class="ch">${lv}<span class="sp"></span><span class="faint">${e.at}</span></div>`}<span>${e.text}</span><span class="faint">来源：${e.src} ›</span></div>`; }
function passedList(d, n = 9) { return d.passed.length ? `<div class="rows">${d.passed.slice(0, n).map(p => `<div class="row"><span class="tag">${p[0]}</span><div class="grow"><b>${p[1]}</b><br><span class="faint">${p[0] === '认定' ? p[2] + ' · ' : ''}${p[4]}</span></div>${p[0] === '成果' ? pill(p[2]) : '<span class="pill p-ok">已认定</span>'}<span class="faint">${p[3]}</span></div>`).join('')}</div>` : empty('还没有通过的成果', '本人提交且通过的版本、项目里对本人任务的认定，都会列在这里'); }
function projExp(d, rich) { const p = d.pj1; if (d.e) return empty('还没有项目经历', '参与的项目确认立项后出现在这里');
  return `<div class="well" style="display:grid;gap:8px"><div class="ch"><b style="font-size:15px">${p.name}</b><span class="tag">主责</span><span class="sp"></span>${pill(p.status)}</div>${p.conclusion ? `<div class="ch"><span class="faint">交付</span>${pill(p.conclusion.delivery)}<span class="faint">业务验证</span>${pill(p.conclusion.verify)}</div>` : ''}<span class="mute">${p.goal}</span>${rich ? `<div class="rows">${p.milestones.map(nodeLine).join('')}</div>` : ''}</div>`; }
const prof = {
  1: d => profHead(d) + `<div class="grid" style="grid-template-columns:1fr 340px"><div class="c"><div class="ch"><h3>项目经历</h3><span class="sp"></span><small>主线：每个项目下挂它带来的成果和证据</small></div>
      ${d.e ? projExp(d) : `${projExp(d, true)}<div class="grid" style="grid-template-columns:1fr 1fr"><div><b style="font-size:12.5px">这个项目里通过的成果</b>${passedList({ ...d, passed: d.passed.filter(x => x[4] === '来电归因优化') })}</div><div style="display:grid;gap:8px;align-content:start"><b style="font-size:12.5px">这个项目提炼的能力证据</b>${d.ev.filter(e => e.no !== 2).length ? d.ev.filter(e => e.no !== 2).map(e => evItem(e, true)).join('') : empty('还没有', '评审通过后带教可以提炼')}</div></div>`}</div>
      <div class="grid"><div class="c"><div class="ch"><h3>项目之外</h3></div>${passedList({ ...d, passed: d.passed.filter(x => x[4] !== '来电归因优化') })}${d.ev.filter(e => e.no === 2).map(e => evItem(e, true)).join('')}</div>${coverageCard(d)}<div class="c"><div class="ch"><h3>阶段复盘、交接卡</h3><span class="proto">原型</span></div><span class="mute">B 级区块，第二轮建表</span></div></div></div>`,
  2: d => profHead(d) + `<div class="grid" style="grid-template-columns:1fr 340px"><div class="c"><div class="ch"><h3>能力证据</h3><span class="sp"></span><small>主线：按「4+1 主线」逐项看证据，判断分三级</small></div>
      <div class="rows">${d.items.map((name, i) => { const list = d.ev.filter(e => e.no === i + 1); const best = Math.max(0, ...list.map(e => JUDGE[e.judge]));
        return `<div class="row" style="align-items:flex-start;padding:12px 2px"><div style="width:190px"><b>${name}</b><br><div class="lv" style="margin-top:6px">${[1, 2, 3].map(k => `<span class="${k <= best ? 'on' : ''}"></span>`).join('')}</div><span class="faint">${list.length ? list.length + ' 条证据' : '还没有证据'}</span></div><div class="grow" style="display:grid;gap:6px">${list.length ? list.map(e => evItem(e)).join('') : '<span class="faint" style="padding-top:2px">—</span>'}</div></div>`; }).join('')}</div></div>
      <div class="grid"><div class="c"><div class="ch"><h3>项目经历</h3></div>${projExp(d)}</div><div class="c"><div class="ch"><h3>通过的成果</h3><span class="sp"></span><small>${d.passed.length} 项</small></div>${passedList(d, 4)}</div><div class="c"><div class="ch"><h3>阶段复盘、交接卡</h3><span class="proto">原型</span></div><span class="mute">B 级区块</span></div></div></div>`,
  3: d => profHead(d) + `<div class="c"><div class="ch"><h3>培养路径</h3><span class="sp"></span><small>主线：按站排，每站下面是这段时间的项目、成果、证据和事件</small></div>
      <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px">${d.path.map((s, i) => `<div class="lane" style="${i === d.curStation ? 'background:#E7E8FC;box-shadow:inset 0 0 0 1.5px #4A4ED8' : ''}"><h4>${s[1]}${s[0] !== s[1] ? `<span class="faint">${s[0]}</span>` : ''}</h4><span class="faint">${s[2]}${i === d.curStation ? ' · 当前' : ''}</span>${s[3].map(t => `<div class="card"><b>${t[0]}</b><span>${pill(t[1])}${t[2] ? ' <span class="faint">' + t[2] + '</span>' : ''}</span></div>`).join('')}${i === 2 && !d.e ? `<div class="card" style="box-shadow:inset 0 0 0 1px #4A4ED8"><span class="tag">项目</span><b>来电归因优化</b><span class="faint">主责 · ${d.pj1.status}</span></div>` : ''}</div>`).join('')}</div></div>
      <div class="grid" style="grid-template-columns:1fr 1fr"><div class="c"><div class="ch"><h3>成长时间线</h3><span class="sp"></span><small>本人的事件 + 参与项目的事件</small></div>${d.timeline.length ? `<div class="tl">${d.timeline.slice(0, 8).map(t => `<div class="ev"><span class="t">${t[0]}</span><span class="rail"><i class="${t[4]}"></i></span><div class="body"><div class="ch"><b>${t[1]}</b><span class="faint">${t[3]}</span></div><span class="mute">${t[2]}</span></div></div>`).join('')}</div>` : empty('还没有事件', '')}</div>
      <div class="grid"><div class="c"><div class="ch"><h3>能力证据</h3><span class="sp"></span><small>${d.ev.length} 条</small></div>${d.ev.length ? d.ev.map(e => evItem(e, true)).join('') : empty('还没有能力证据', '')}</div><div class="c"><div class="ch"><h3>通过的成果</h3></div>${passedList(d, 4)}</div></div></div>`,
};

// ---------- 页面与版本说明 ----------
const PAGES = {
  homeT: { name: '首页 · 管培生', role: 'trainee', active: 'home', crumb: '工作台 › <b>首页</b>', render: homeT, vers: [
    ['目标为中心', '先看在推进什么：主推项目的目标、当前节点和验收标准占最大块，下一步行动和受阻挂在节点下面。', '项目是主线的人最顺手；但同时推进两个项目时，第二个项目被挤到次要位置。', '强调块 = 主推项目卡（项目、节点、行动合在一块）'],
    ['行动为中心', '先看现在该做什么：最重要的下一步单独占强调块，其次是需要协调的事；项目和节点退到第二排。', '一眼知道今天干什么；项目全貌要点进项目详情才看得全。', '强调块 = 最重要的下一步'],
    ['反馈回路为中心', '先看和带教来回到了哪一步：把「提交 → 评审 → 行动 → 再交」做成回路，标出现在轮到谁；右边是回路时间线。', '最能说明「带教反馈形成闭环」；但新人没有来回时整页偏空，多个项目时要切换。', '强调块 = 回路当前环节']] },
  homeM: { name: '首页 · 带教', role: 'mentor', active: 'home', crumb: '工作台 › <b>首页</b>', render: homeM, vers: [
    ['按项目', '我带的人的项目做成四列看板：待确认立项、推进中、等我评审、受阻。', '项目多时一眼看全局；但「我该先做哪件」要自己在四列里找。', '无强调块，看板本身是焦点'],
    ['按事', '「待我判断」三类（评审、立项、受阻）放强调块，与待办一致；下面每人一行看风险；管理者附决策看板。', '先清待办再看人，最贴合 PRD 10.2 的写法；人数多时「我带的人」要往下翻。', '强调块 = 待我判断'],
    ['按人', '每位管培生一张卡：在哪站、当前项目与节点、最近反馈、风险，以及等我处理的事。', '带的人少（现在两人）时最直观；人多了卡片会很长，事情分散在各卡里。', '强调块 = 第一位有待办的人']] },
  proj: { name: '项目详情', role: 'mentor', active: 'proj', crumb: '项目实践 › 项目 › <b>项目详情</b>', render: proj, vers: [
    ['节点路线', '顶部是节点路线图，下方展开当前节点：目标、验收标准、受阻、每一版成果与评审。项目信息和结论在右栏。', '最像「推进一个项目」的心智；节点多于五六个时路线图要横向滚动。', '不放强调块'],
    ['总览分栏', '三栏：左栏项目信息与成员，中间节点表和结论，右栏未完成行动与最近反馈；节点详情用右侧抽屉打开。', '信息最全、最像管理工具；第一眼不突出「现在卡在哪」。', '不放强调块'],
    ['项目日志', '顶部一条摘要（节点进度、当前节点、带教、交付与验证），主体是按时间倒序的项目日志，每条点回节点或版本。', '最适合回看「这个项目怎么走过来的」；但要执行操作得先找到对应节点。', '不放强调块']] },
  prof: { name: '成长档案', role: 'trainee', active: 'prof', crumb: '培养成长 › <b>成长档案</b>', render: prof, vers: [
    ['项目经历主线', '按项目组织：每个项目下面挂它带来的通过成果和能力证据；项目之外的成果单列。', '最能回答「做过什么、做成了没有」；能力项的覆盖情况要看右栏计数。', '不放强调块'],
    ['能力证据主线', '按「4+1 主线」五个能力项逐行列出证据和判断等级，每条点回来源；项目经历和成果在右栏。', '最贴合季度答辩和阶段复盘；项目的来龙去脉被拆散到各能力项里。', '不放强调块'],
    ['培养路径主线', '按站排时间：每站下是这段时间的任务和项目；下面是成长时间线、能力证据和通过的成果。', '最能看出「在哪一站做了什么」；跨站的项目只能挂在开始的那一站。', '不放强调块']] },
};
const REC = '建议把附录 A 的「全屏唯一强调块」从「这一步可以用」（推荐 AI 资产）改为：管培生首页放「最重要的下一步」，带教首页放「待我判断」；「这一步可以用」降为普通卡（B 级）。项目详情、成长档案不放强调块。三版里标了各自把强调块放在哪。';

// ---------- 交互 ----------
let cur = { page: 'homeT', ver: 2, state: 'revise' };
try { const s = JSON.parse(localStorage.getItem('pick') || 'null'); if (s && PAGES[s.page]) cur = s; } catch (e) {}
const $ = id => document.getElementById(id);
function btns(el, list, key) { el.innerHTML = list.map(([k, label]) => `<button type="button" id="${el.id}-${k}" aria-pressed="${String(cur[key]) === String(k)}" data-k="${k}">${label}</button>`).join('');
  el.onclick = ev => { const b = ev.target.closest('button'); if (!b) return; cur[key] = key === 'ver' ? Number(b.dataset.k) : b.dataset.k; render(); }; }
function render() {
  const P = PAGES[cur.page];
  btns($('pages'), Object.entries(PAGES).map(([k, p]) => [k, p.name]), 'page');
  btns($('vers'), P.vers.map((v, i) => [i + 1, `<b>版 ${i + 1}</b>${v[0]}`]), 'ver');
  btns($('states'), Object.entries(STATES), 'state');
  const v = P.vers[cur.ver - 1];
  $('note').innerHTML = `<div><h2>版 ${cur.ver} · ${v[0]}的思路</h2><p>${v[1]}</p></div><div><h2>取舍</h2><p>${v[2]}</p></div><div><h2>强调块放在</h2><p>${v[3]}</p></div><div class="rec"><h2>附录 A 改法（建议）</h2><p>${REC}</p></div>`;
  const d = data(cur.state);
  const todo = P.role === 'mentor' ? d.toReview.length + d.toConfirm.length + d.blockers.length : d.actions.length;
  $('mk').innerHTML = shell(P.role, P.active, P.crumb, P.render[cur.ver](d), todo);
  try { localStorage.setItem('pick', JSON.stringify(cur)); } catch (e) {}
  fit();
}
function fit() { const w = $('stage').clientWidth; const s = Math.min(1, w / 1360); $('fit').style.transform = `scale(${s})`; $('stage').style.height = $('mk').offsetHeight * s + 'px'; }
addEventListener('resize', fit);
render();
</script>
