<title>管培生工作台结构重排</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --surface2:#FAFAFB; --surface3:#F1F2F4; --grid:#E4E6EA; --hl:#E2E5EA;
  --ink:#101318; --ink2:#434A55; --ink3:#5F6672; --thin:#7A818C; --rule:#D7DAE0; --rule2:#E6E8EC; --topbg:rgba(243,244,246,.94);
  --band:#15181D; --band2:#1D2128; --band3:#262B33; --bandrule:#2E343D; --dink:#ECEEF2; --dink2:#A7AEBA; --dink3:#8D95A2; --dstrong:#FFFFFF;
  --s1:#DD5129; --s1t:#FBE8E1; --s1d:#AE3714;
  --s2:#2D53D2; --s2t:#E6ECFB; --s2d:#1D3BA3;
  --s3:#0A8470; --s3t:#DBF0EA; --s3d:#05604F;
  --onc:#FFFFFF;
  --c:var(--ink); --ct:var(--rule2); --cd:var(--ink);
  /* 原型窗口：沿用 PRD 附录 A「01 器」色板，浅色截图在深浅两种主题下都保持原样 */
  --a-bg:#E8EAEE; --a-panel:#FFFFFF; --a-soft:#F5F6F8; --a-line:#E7E9ED; --a-ink:#14161A; --a-ink2:#3B4048; --a-mute:#6B707A;
  --a-acc:#3446E0; --a-acct:#ECEEFD; --a-ok:#2F7A58; --a-okt:#E3F1E9; --a-warn:#A8670C; --a-warnt:#F8ECD8; --a-bad:#BF3F2C; --a-badt:#F9E3DF; --a-neu:#62666D; --a-neut:#EEF0F2; --a-dark:#14161A;
  --l-t:#DCE2F8; --l-td:#2F428F; --l-c:#F4E4D2; --l-cd:#7A4A1C; --l-m:#DCEFE4; --l-md:#235E45;
  /* 固定色：浅色原型窗口、演示窗口与色块用，深浅主题下不变 */
  --k-000000:#000; --k-101318:#101318; --k-1d2128:#1D2128; --k-434a55:#434A55; --k-5a6577:#5A6577; --k-5f6672:#5F6672; --k-8a6a3b:#8A6A3B; --k-a7adb6:#A7ADB6; --k-a7aeba:#A7AEBA; --k-ae3714:#AE3714; --k-b0875a:#B0875A; --k-c9d3f5:#C9D3F5; --k-d0d4db:#D0D4DB; --k-d5d8dd:#D5D8DD; --k-d7dae0:#D7DAE0; --k-dd5129:#DD5129; --k-e6e8ec:#E6E8EC; --k-f2f4f7:#F2F4F7; --k-f7f8f9:#F7F8F9; --k-fafbff:#FAFBFF; --k-fffbf5:#FFFBF5; --k-rgba-98-102-109-12:rgba(98,102,109,.12);
  --ease:cubic-bezier(.22,.7,.2,1);
  --sans:'Noto Sans SC',-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --mono:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace;
  --num:'Archivo','Helvetica Neue',Arial,'Noto Sans SC',sans-serif;
  --w:1240px; --g:40px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1114; --surface:#171A1F; --surface2:#1B1F25; --surface3:#20242B; --grid:#1C2026; --hl:#2A3038;
  --ink:#ECEEF2; --ink2:#B9BFC9; --ink3:#9AA1AD; --thin:#8D95A2; --rule:#2E343D; --rule2:#252A31; --topbg:rgba(15,17,20,.92);
  --band:#08090B; --band2:#14171C; --band3:#1D2128; --bandrule:#2A2F37;
  --s1:#F0714C; --s1t:#3A1F16; --s1d:#F5A285; --s2:#6D8DF0; --s2t:#1A2443; --s2d:#A9BCF7; --s3:#2FB89D; --s3t:#0E2E28; --s3d:#7BD8C4;
}}
:root[data-theme="dark"]{
  --bg:#0F1114; --surface:#171A1F; --surface2:#1B1F25; --surface3:#20242B; --grid:#1C2026; --hl:#2A3038;
  --ink:#ECEEF2; --ink2:#B9BFC9; --ink3:#9AA1AD; --thin:#8D95A2; --rule:#2E343D; --rule2:#252A31; --topbg:rgba(15,17,20,.92);
  --band:#08090B; --band2:#14171C; --band3:#1D2128; --bandrule:#2A2F37;
  --s1:#F0714C; --s1t:#3A1F16; --s1d:#F5A285; --s2:#6D8DF0; --s2t:#1A2443; --s2d:#A9BCF7; --s3:#2FB89D; --s3t:#0E2E28; --s3d:#7BD8C4;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.75;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow-x:hidden}
main{overflow-x:clip}
h1,h2,h3,h4,h5,p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
code{font-family:var(--mono);font-size:.86em;background:var(--surface3);padding:1px 5px;border-radius:2px;overflow-wrap:anywhere}
:focus-visible{outline:2px solid var(--c,var(--ink));outline-offset:3px}
.wrap{max-width:var(--w);margin:0 auto;padding-left:max(var(--g),env(safe-area-inset-left,0px));padding-right:max(var(--g),env(safe-area-inset-right,0px))}
.k{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.s1{--c:var(--s1);--ct:var(--s1t);--cd:var(--s1d)}
.s2{--c:var(--s2);--ct:var(--s2t);--cd:var(--s2d)}
.s3{--c:var(--s3);--ct:var(--s3t);--cd:var(--s3d)}
.cap{font-size:12.5px;color:var(--ink3);line-height:1.6}
.fig-cap{margin-top:12px;font-size:12.5px;color:var(--ink3);line-height:1.65}
.fig-cap>b:first-child{font-family:var(--mono);font-weight:700;color:var(--cd);white-space:nowrap;margin-right:10px}
.fig-cap b{color:var(--ink2)}
.dark .fig-cap{color:var(--dink3)}
.dark .fig-cap b{color:var(--dink2)}
.dark .fig-cap>b:first-child{color:var(--dink)}
/* 依据标签 */
.ev{display:inline-block;font-family:var(--mono);font-size:11px;line-height:1.5;padding:0 6px;margin:0 2px;border-radius:2px;white-space:nowrap;vertical-align:1px;font-weight:500}
.ev.p{background:var(--s2t);color:var(--s2d)}
.ev.o{background:var(--surface3);color:var(--ink2);border:1px solid var(--rule)}
.ev.g{color:var(--s1d);border:1px dashed var(--s1);background:transparent}
.ev.x{color:var(--ink2);border:1px dotted var(--ink3)}
.dark .ev.o{background:var(--band3);color:var(--dink2);border-color:var(--bandrule)}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--topbg);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;text-decoration:none;white-space:nowrap}
.brand i{display:inline-flex;gap:2px}
.brand i b{width:6px;height:16px;display:block}
.top nav{display:flex;gap:2px;overflow:hidden}
.top nav a{text-decoration:none;font-size:13px;color:var(--ink2);padding:6px 9px;border-radius:3px;white-space:nowrap;transition:background .2s var(--ease),color .2s var(--ease)}
.top nav a:hover{background:var(--rule2);color:var(--ink)}
.top nav a span{font-family:var(--mono);font-size:11px;margin-right:5px;color:var(--ink3);font-weight:700}

/* hero */
.hero{position:relative;padding:72px 0 80px;border-bottom:1px solid var(--rule);background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:40px 40px;background-position:-1px -1px}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,color-mix(in srgb,var(--bg) 60%,transparent) 55%,var(--bg) 100%);pointer-events:none}
.hero .wrap{position:relative;z-index:1}
.hero-head{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:56px;align-items:end}
.eyebrow{display:flex;align-items:center;gap:12px;margin-bottom:28px;flex-wrap:wrap}
.eyebrow .bars{display:flex;gap:3px}
.eyebrow .bars b{width:22px;height:4px;display:block}
.hero h1{font-weight:900;font-size:clamp(42px,6.4vw,86px);line-height:1.06;letter-spacing:-.02em}
.hero h1 .thin{font-weight:400;color:var(--thin)}
.hero .sub{margin-top:28px;font-size:clamp(18px,1.7vw,22px);line-height:1.6;font-weight:500;color:var(--ink2)}
.hero .sub b{color:var(--ink);font-weight:700;background:linear-gradient(transparent 62%,var(--hl) 62%)}
.quote{border-top:2px solid var(--ink);padding-top:20px;margin:0 0 6px}
.quote p{font-size:17px;line-height:1.75;color:var(--ink)}
.quote .who{margin-top:14px;font-size:13px;color:var(--ink3);line-height:1.6}
.quote .who b{font-weight:700;color:var(--ink);font-size:14px;display:block}
.spine{margin-top:64px;display:grid;grid-template-columns:minmax(0,1fr) 48px minmax(0,1fr) 48px minmax(0,1fr)}
.sp-col{display:flex;flex-direction:column;text-decoration:none;background:var(--surface);border:1px solid var(--rule);border-top:4px solid var(--c);transition:border-color .25s var(--ease),transform .25s var(--ease)}
.sp-col:hover{border-color:var(--c);transform:translateY(-3px)}
.sp-sec{padding:18px 20px}
.sp-sec+.sp-sec{border-top:1px solid var(--rule2)}
.sp-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sp-num{font-family:var(--num);font-weight:800;font-size:44px;line-height:1;color:var(--c);letter-spacing:-.02em}
.sp-top .k{color:var(--cd)}
.sp-col h3{margin-top:12px;font-size:22px;font-weight:900;letter-spacing:-.01em}
.sp-col .what{margin-top:4px;font-size:14px;color:var(--ink2);line-height:1.6}
.sp-lab{margin-bottom:8px}
.sp-lab .k{font-size:11px}
.sp-chips{display:flex;flex-wrap:wrap;gap:6px}
.sp-chips span{font-size:12.5px;padding:2px 9px;background:var(--ct);color:var(--cd);font-weight:500}
.sp-chips span.n{background:transparent;border:1px solid var(--c)}
.sp-link{display:flex;align-items:center;justify-content:center}
.sp-link .arr{width:100%;height:12px;position:relative}
.sp-link .arr::before{content:"";position:absolute;left:8px;right:12px;top:5px;height:2px;background:var(--ink)}
.sp-link .arr::after{content:"";position:absolute;right:6px;top:1px;border:5px solid transparent;border-left:8px solid var(--ink);border-right:0}
.loop{margin-top:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;border:1px dashed var(--rule);padding:10px 16px;font-size:13.5px;color:var(--ink2);background:var(--surface2)}
.loop b{color:var(--ink)}
.nums{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);margin-top:48px}
.nums>div{padding:18px 18px 18px 0}
.nums>div+div{padding-left:18px;border-left:1px solid var(--rule2)}
.nums b{font-family:var(--num);font-weight:800;font-size:clamp(28px,3vw,40px);line-height:1;letter-spacing:-.02em;display:block}
.nums b small{font-size:.5em;font-weight:700;margin-left:2px}
.nums span{display:block;margin-top:10px;font-size:13.5px;line-height:1.55;color:var(--ink)}
.nums .cap{margin-top:4px}
.nums .hl b{color:var(--c)}
.basis{margin-top:28px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;font-size:13.5px;color:var(--ink2);line-height:1.7}
.basis h4{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink3);font-weight:500;margin-bottom:8px}
.basis ul{margin:0;padding-left:18px}
.legend{display:flex;flex-direction:column;gap:6px}
.legend div{display:flex;gap:10px;align-items:baseline}

/* sections */
.sec{padding:112px 0}
.sec-k{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.sec-k::before{content:"";width:28px;height:2px;background:var(--ink)}
h2.h2{font-size:clamp(30px,3.6vw,46px);line-height:1.18;font-weight:900;letter-spacing:-.015em}
.white{background:var(--surface);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.concl{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,2.4fr);gap:56px}
.concl-lead p{margin-top:20px;color:var(--ink2);font-size:15px}
.concl ol{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink);counter-reset:c;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.concl li{counter-increment:c;padding:18px 22px 18px 0;border-bottom:1px solid var(--rule2);font-size:15px;line-height:1.7;color:var(--ink2);display:grid;grid-template-columns:34px minmax(0,1fr)}
.concl li:nth-child(even){padding-left:22px;border-left:1px solid var(--rule2)}
.concl li::before{content:counter(c,decimal-leading-zero);font-family:var(--num);font-weight:800;font-size:15px;color:var(--ink3);padding-top:2px}
.concl li b{color:var(--ink)}

.stage{padding:120px 0 40px}
.st-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:48px;align-items:end;padding-bottom:36px;border-bottom:1px solid var(--ink)}
.st-head.rev{grid-template-columns:minmax(0,1fr) auto}
.st-head.rev .st-num{order:2}
.st-num{font-family:var(--num);font-weight:800;font-size:clamp(96px,13vw,180px);line-height:.78;color:var(--c);letter-spacing:-.05em}
.st-head .k{color:var(--cd);display:block;margin-bottom:14px}
.st-head h2{font-size:clamp(28px,3.6vw,48px);line-height:1.15;font-weight:900;letter-spacing:-.015em}
.st-head h2 em{font-style:normal;color:var(--c)}
.st-head p{margin-top:14px;font-size:15.5px;color:var(--ink2);max-width:760px}
.blk{padding:64px 0;border-bottom:1px solid var(--rule2)}
.blk:last-child{border-bottom:0}
.blk-k{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.blk-k::before{content:"";width:16px;height:2px;background:var(--c);flex:none}
.blk-k h3{font-size:21px;font-weight:900;letter-spacing:-.01em}
.blk-k .k{margin-left:auto}
.lead{font-size:16.5px;line-height:1.8;color:var(--ink);max-width:880px;margin-bottom:24px}
.lead+.lead{margin-top:-12px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--rule);background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:13.5px;line-height:1.6}
.t th{font-family:var(--mono);font-size:11px;letter-spacing:.05em;font-weight:500;color:var(--ink3);text-align:left;padding:10px 12px;background:var(--surface2);border-bottom:1px solid var(--rule);white-space:nowrap}
.t td{padding:10px 12px;border-bottom:1px solid var(--rule2);vertical-align:top;color:var(--ink2);overflow-wrap:anywhere}
.t tr:last-child td{border-bottom:0}
.t td b{color:var(--ink)}
.t td.nw{white-space:nowrap}
.t td.id{font-family:var(--mono);font-size:12px;color:var(--cd);white-space:nowrap;font-weight:700}
.t .grp td{background:var(--surface3);font-weight:700;color:var(--ink);font-size:12.5px}
.t.min{min-width:860px}
.t.wide{min-width:1080px}
.st{display:inline-block;font-size:11.5px;font-weight:700;padding:0 7px;border-radius:2px;white-space:nowrap}
.st.keep{background:var(--surface3);color:var(--ink2)}
.st.rev{background:var(--s2t);color:var(--s2d)}
.st.new{background:var(--s1t);color:var(--s1d)}
.st.del{background:transparent;color:var(--ink3);border:1px solid var(--rule);text-decoration:line-through}
.mk{font-family:var(--mono);font-weight:700}
.mk.no{color:var(--s1d)} .mk.half{color:var(--ink3)} .mk.yes{color:var(--s3d)}
details.more{margin-top:14px;border:1px solid var(--rule);background:var(--surface)}
details.more summary{cursor:pointer;padding:12px 16px;font-size:14px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"展开";font-family:var(--mono);font-size:11px;color:var(--ink3);font-weight:500}
details.more[open] summary::after{content:"收起"}
details.more .tw{border:0;border-top:1px solid var(--rule)}

/* chain (root cause) */
.chain{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border:1px solid var(--rule);background:var(--surface)}
.chain>div{padding:16px 16px 18px;position:relative}
.chain>div+div{border-left:1px solid var(--rule2)}
.chain>div+div::before{content:"";position:absolute;left:-7px;top:22px;border:6px solid transparent;border-left:7px solid var(--ink);border-right:0}
.chain small{display:block;font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:.04em}
.chain b{display:block;margin-top:6px;font-size:15px;line-height:1.5}
.chain span{display:block;margin-top:6px;font-size:12.5px;color:var(--ink3);line-height:1.55}
.chain .end{background:var(--c);color:var(--onc)}
.chain .end small,.chain .end span{color:color-mix(in srgb,var(--onc) 85%,transparent)}

/* code blocks / schema */
.code{font-family:var(--mono);font-size:12.5px;background:var(--surface);border:1px solid var(--rule);padding:14px 16px;line-height:1.8;color:var(--ink);overflow-x:auto;white-space:pre;margin:0}
.code .c{color:var(--ink3)}
.code .kw{color:var(--cd);font-weight:700}
.fig{background:var(--surface);border:1px solid var(--rule);padding:18px;overflow-x:auto}
.fig pre.mermaid{margin:0;background:transparent;font-family:var(--mono);font-size:12px;line-height:1.5;color:var(--ink2);white-space:pre;min-width:640px}
.figrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}

/* tabs (scene matrix) */
.tabs{display:flex;border:1px solid var(--rule);border-bottom:0;background:var(--surface2);overflow-x:auto}
.tabs button{background:none;border:0;border-right:1px solid var(--rule2);padding:12px 18px;font-size:14px;color:var(--ink3);cursor:pointer;white-space:nowrap;transition:color .2s var(--ease),background .2s var(--ease)}
.tabs button span{font-family:var(--mono);font-size:11px;margin-right:6px}
.tabs button:hover{color:var(--ink);background:var(--surface)}
.tabs button[aria-selected=true]{color:var(--ink);font-weight:700;background:var(--surface);box-shadow:inset 0 3px 0 var(--c)}
.tabp{display:none}
.tabp.on{display:block}
.cell-q{font-weight:700;color:var(--ink);display:block}
.cell-now{display:block;margin-top:4px;font-size:12.5px;color:var(--ink3)}
.cell-new{display:block;margin-top:4px;font-size:12.5px;color:var(--cd);font-weight:500}

/* day compare (scene figure) */
.day{display:grid;grid-template-columns:86px minmax(0,1fr) minmax(0,1fr);border:1px solid var(--rule);background:var(--surface)}
.day>div{padding:12px 14px;border-bottom:1px solid var(--rule2);font-size:13.5px;line-height:1.6;color:var(--ink2)}
.day .hd{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink3);background:var(--surface2)}
.day .tm{font-family:var(--mono);font-size:12px;color:var(--ink);font-weight:700}
.day .now{border-left:1px solid var(--rule2)}
.day .aft{border-left:1px solid var(--rule2);background:color-mix(in srgb,var(--ct) 45%,transparent);color:var(--ink)}
.day .lst{border-bottom:0}

/* demo surfaces */
.dark{background:var(--band);color:var(--dink)}
.dark .blk-k h3{color:var(--dstrong)}
.dark .blk-k .k{color:var(--dink3)}
.dark .lead{color:var(--dink)}
.blk.band{margin:0 calc(50% - 50vw);padding:64px calc(50vw - 50%) 72px;border-bottom:0}
.blk.panel{margin:8px 0 0;padding:40px 40px 44px;border-bottom:0}
.dm-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:24px}
.dm-head h4{font-size:clamp(22px,2.4vw,30px);font-weight:900;line-height:1.3;color:var(--dstrong);letter-spacing:-.01em}
.dm-head p{margin-top:8px;font-size:14px;color:var(--dink2);max-width:760px}
.dm-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.ap-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c3{grid-column:span 3}.c9{grid-column:span 9}.c12{grid-column:span 12}
.ac{border:1px solid var(--a-line);border-radius:14px;padding:12px 14px;background:var(--a-panel)}

.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--a-line);border-radius:10px;overflow:hidden}
