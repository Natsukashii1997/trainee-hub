<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>知识入库完成卡｜高保真原型</title>
  <style>
    :root {
      color-scheme: light;
      --text-1: #1f2329;
      --text-2: #646a73;
      --text-3: #8f959e;
      --line: #dee0e3;
      --blue: #1456f0;
      --blue-hover: #0c47d4;
      --green: #1a7f37;
      --green-2: #2b8a3e;
      --green-bg: #eefbea;
      --blue-bg: #f1f5ff;
      --violet-bg: #f7f3ff;
      --page: #f5f6f7;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--page);
      color: var(--text-1);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
        "Noto Sans CJK SC", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      width: 1440px;
      min-height: 1180px;
      padding: 34px 54px 70px;
    }

    .prototype-label {
      position: absolute;
      top: 22px;
      right: 42px;
      padding: 7px 12px;
      border: 1px solid #d9dde6;
      border-radius: 999px;
      color: #7b818a;
      background: rgba(255,255,255,.88);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .02em;
    }

    .message {
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr);
      gap: 14px;
      width: 100%;
      max-width: 1280px;
      margin: 10px auto 0;
    }

    .avatar {
      width: 52px;
      height: 52px;
      margin-top: 2px;
      border-radius: 10px;
      overflow: hidden;
      background: linear-gradient(145deg, #dfe9ff, #d7f4ef);
      border: 1px solid rgba(0,0,0,.05);
      box-shadow: 0 2px 8px rgba(31,35,41,.08);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .sender-line {
      height: 29px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-2);
      font-size: 17px;
      margin-bottom: 9px;
    }

    .sender-name {
      color: #5b616a;
      font-weight: 500;
    }

    .bot-tag {
      padding: 2px 7px 3px;
      border-radius: 5px;
      color: #6b45da;
      background: #eee8ff;
      font-size: 14px;
      font-weight: 600;
    }

    .dot { color: #c3c6cc; }

    .card {
      width: 100%;
      overflow: hidden;
      border: 1px solid #d8dbe0;
      border-radius: 13px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(31,35,41,.04);
    }

    .card-header {
      position: relative;
      min-height: 128px;
      padding: 25px 28px 22px;
      overflow: hidden;
      background:
        radial-gradient(circle at 88% 6%, rgba(124,214,139,.25), transparent 31%),
        linear-gradient(104deg, #e7f9e8 0%, #f0fbec 49%, #e4f7e7 100%);
      border-bottom: 1px solid #e8f0e7;
    }

    .header-kicker {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 8px;
      color: #3f7c4a;
      font-size: 15px;
      font-weight: 600;
    }

    .success-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 21px;
      height: 21px;
      border-radius: 50%;
      color: white;
      background: #31a24c;
      font-size: 14px;
      line-height: 1;
      box-shadow: 0 2px 5px rgba(49,162,76,.20);
    }

    .card-title {
      margin: 0;
      color: #146b2c;
      font-size: 29px;
      line-height: 1.35;
      font-weight: 700;
      letter-spacing: -.01em;
    }

    .card-subtitle {
      margin-top: 7px;
      color: #52715a;
      font-size: 16px;
      line-height: 1.6;
    }

    .complete-tag {
      position: absolute;
      top: 25px;
      right: 28px;
      display: inline-flex;
      align-items: center;
      height: 30px;
      padding: 0 12px;
      border: 1px solid rgba(26,127,55,.16);
      border-radius: 7px;
      color: #197435;
      background: rgba(255,255,255,.68);
      font-size: 14px;
      font-weight: 650;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      gap: 17px;
      padding: 24px 26px 20px;
    }

    .section {
      border-radius: 11px;
      padding: 18px 20px;
    }

    .location-section {
      background: var(--blue-bg);
      border: 1px solid #e4eaff;
    }

    .section-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      color: #3f4652;
      font-size: 16px;
      line-height: 1.45;
      font-weight: 700;
    }

    .label-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 23px;
      height: 23px;
      border-radius: 6px;
      color: #2b60cf;
      background: #dde8ff;
      font-size: 14px;
      font-weight: 700;
    }

    .library-name {
      color: #757b84;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 4px;
    }

    .breadcrumb {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px;
      color: #25324a;
      font-size: 20px;
      line-height: 1.55;
      font-weight: 600;
    }

    .breadcrumb .arrow {
      color: #9aa4b5;
      font-size: 18px;
      font-weight: 400;
    }

    .reason-section {
      background: var(--violet-bg);
      border: 1px solid #eee7fb;
    }

    .reason-section .section-label { margin-bottom: 8px; }

    .reason {
      margin: 0;
      color: #353942;
      font-size: 16px;
      line-height: 1.72;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr;
    }

    button {
      height: 50px;
      border-radius: 8px;
      font: inherit;
      font-size: 16px;
      font-weight: 500;
      cursor: default;
    }

    .primary-button {
      border: 1px solid var(--blue);
      color: #fff;
      background: var(--blue);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.04);
    }

    .feedback {
      padding-top: 2px;
      border-top: 1px solid #ebecef;
    }

    .feedback-heading {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin: 15px 0 9px;
    }

    .feedback-heading strong {
      color: #3f444c;
      font-size: 16px;
    }

    .feedback-heading span {
      color: #8a9099;
      font-size: 13px;
    }

    textarea {
      display: block;
      width: 100%;
      height: 68px;
      resize: none;
      border: 1px solid #c9cdd4;
      border-radius: 8px;
      padding: 12px 14px;
      color: #30343b;
      background: #fff;
      outline: none;
      font: inherit;
      font-size: 15px;
      line-height: 1.45;
    }

    textarea::placeholder { color: #a1a6ad; }

    .feedback-action {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-top: 10px;
    }

    .feedback-note {
      color: #8a9099;
      font-size: 13px;
      line-height: 1.55;
    }

    .feedback-button {
      flex: 0 0 178px;
      height: 42px;
      border: 1px solid #c9cdd4;
      color: #4a4f57;
      background: #f8f9fa;
      font-size: 14px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      gap: 7px;
      padding-top: 2px;
      color: #777d86;
      font-size: 13px;
      line-height: 1.6;
    }

    .status-green {
      color: #1b7f35;
      font-weight: 600;
    }

    .footer-separator { color: #b1b5bc; }

    .footer-link {
      color: var(--blue);
      text-decoration: none;
    }

    .reaction {
      position: absolute;
      right: -64px;
      top: 65px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 42px;
      border: 1px solid #d9dce1;
      border-radius: 7px;
      color: #87909c;
      background: #fff;
      font-size: 20px;
    }

    .message-content { position: relative; }
  </style>
</head>
<body>
  <div class="prototype-label">高保真原型 · 未连接真实数据</div>

  <main class="message" aria-label="知识入库完成卡高保真原型">
    <div class="avatar"><img src="./mechanical-dragon-avatar.png" alt="机械邪龙兽头像" /></div>

    <div class="message-content">
      <div class="sender-line">
        <span class="sender-name">机械邪龙兽</span>
        <span class="bot-tag">智能体</span>
        <span class="dot">|</span>
        <span>9月14日 21:18</span>
      </div>

      <article class="card">
        <header class="card-header">
          <div class="header-kicker"><span class="success-mark">✓</span>知识入库</div>
          <h1 class="card-title">已入库｜季度复盘内容反馈</h1>
          <div class="card-subtitle">已同步至管培生知识库 · 原文内容与权限保持不变</div>
          <div class="complete-tag">已完成</div>
        </header>

        <div class="card-body">
          <section class="section location-section">
            <div>
              <h2 class="section-label"><span class="label-icon">⌁</span>入库地址</h2>
              <div class="library-name">管培生知识库</div>
              <div class="breadcrumb">
                <span>07｜成员成长档案</span>
                <span class="arrow">→</span>
                <span>阶段答辩</span>
              </div>
            </div>
          </section>

          <section class="section reason-section">
            <h2 class="section-label"><span class="label-icon">i</span>归类说明</h2>
            <p class="reason">该文档集中记录季度答辩中的评分、问题诊断、重构建议与现场带教问题，属于成员阶段成长的答辩证据，因此归入「成员成长档案 → 阶段答辩」。</p>
          </section>

          <div class="button-row" aria-label="查看入口">
            <button class="primary-button" type="button">查看入库文档</button>
          </div>

          <section class="feedback" aria-label="调整建议">
            <div class="feedback-heading">
              <strong>调整建议</strong>
              <span>仅归档位置明显不合适时填写</span>
            </div>
            <textarea readonly placeholder="例如：请调整至「06｜项目复盘」，并说明原因"></textarea>
            <div class="feedback-action">
              <span class="feedback-note">提交后，机器人将重新判断位置并同步新的入库结果。</span>
              <button class="feedback-button" type="button">提交调整建议</button>
            </div>
          </section>

          <footer class="card-footer">
            <span>入库状态：</span>
            <span class="status-green">已完成</span>
            <span class="footer-separator">｜</span>
            <a class="footer-link" href="#">管培生知识库</a>
          </footer>
        </div>
      </article>

      <div class="reaction" aria-hidden="true">👍</div>
    </div>
  </main>
</body>
</html>
